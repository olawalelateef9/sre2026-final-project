# Proposes dependency, base-image and action updates as pull requests, which then
# pass through the same tests and scans as any other change.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  # Python services: Dependabot updates requirements.in and regenerates the hashed lock.
  - package-ecosystem: pip
    directories:
      - /techbleat-global-bank-backend/user-service
      - /techbleat-global-bank-backend/activity-service
      - /finance-agent
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held on 2.x until the 3.x client API is verified against a live key.
      - dependency-name: openai
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /techbleat-global-bank-backend/transaction-service
    schedule: {interval: weekly}
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /techbleat-global-bank-frontend
    schedule: {interval: weekly}
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images pinned by digest in each Dockerfile.
  - package-ecosystem: docker
    directories:
      - /techbleat-global-bank-backend/user-service
      - /techbleat-global-bank-backend/activity-service
      - /techbleat-global-bank-backend/transaction-service
      - /finance-agent
      - /techbleat-global-bank-frontend
    schedule: {interval: weekly}
    groups:
      base-images: {patterns: ["*"]}

  - package-ecosystem: docker-compose
    directory: /techbleat-global-bank-backend
    schedule: {interval: weekly}
