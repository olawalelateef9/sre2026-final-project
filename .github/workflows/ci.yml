# Test, scan, build, and publish Techbleat Global Bank images.
#
# Pull requests: secret scan, dependency scan, all tests, image build + image scan.
# Push to main or a v* tag: the same, then publish each image to GHCR by digest,
# with an SPDX SBOM, a keyless Cosign signature, and SLSA build provenance.
#
# Third-party actions are pinned to full commit SHAs (tag shown in the comment);
# scanners run from digest-pinned images. Dependabot proposes updates to both.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Release gate: fail on HIGH/CRITICAL findings that have a fix. Exceptions live in .trivyignore.
  TRIVY_SEVERITY: HIGH,CRITICAL
  REGISTRY: ghcr.io

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --exit-code 1
          --report-format sarif --report-path /repo/gitleaks.sarif
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pom.xml is skipped here: resolving it needs Maven Central, which rate-limits
      # scanners. Java libraries are gated in the image scan, which reads the built JAR.
      - name: Trivy (lock files and manifests)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" fs \
            --scanners vuln --severity "$TRIVY_SEVERITY" --ignore-unfixed \
            --skip-files techbleat-global-bank-backend/transaction-service/pom.xml \
            --ignorefile .trivyignore --format json --output trivy-dependencies.json .
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" convert \
            --format table --exit-code 1 --severity "$TRIVY_SEVERITY" trivy-dependencies.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-dependencies
          path: trivy-dependencies.json
          if-no-files-found: ignore

  test-transaction-service:
    name: Test transaction-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: techbleat-global-bank-backend/transaction-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: techbleat-global-bank-backend/transaction-service/pom.xml
      - run: mvn -B verify
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-transaction-service
          path: techbleat-global-bank-backend/transaction-service/target/surefire-reports/
          if-no-files-found: ignore

  test-python:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            path: techbleat-global-bank-backend/user-service
            test: python -m pytest -q --junitxml=test-results.xml tests
          - service: activity-service
            path: techbleat-global-bank-backend/activity-service
            test: python -m pytest -q --junitxml=test-results.xml tests
          - service: finance-agent
            path: finance-agent
            test: python -m unittest discover -s tests -v
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements*.txt
      - name: Install hash-locked dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          else
            pip install --require-hashes -r requirements.txt
          fi
      - run: ${{ matrix.test }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.path }}/test-results.xml
          if-no-files-found: ignore

  test-frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: techbleat-global-bank-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: techbleat-global-bank-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: No secrets in the browser bundle
        run: >
          docker run --rm -v "$PWD/dist:/dist" "$GITLEAKS_IMAGE"
          dir /dist --redact --no-banner --exit-code 1

  images:
    name: Image ${{ matrix.name }}
    needs: [secret-scan, dependency-scan, test-transaction-service, test-python, test-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing and provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            context: techbleat-global-bank-backend/user-service
            dockerfile: techbleat-global-bank-backend/user-service/Dockerfile
          - name: transaction-service
            context: techbleat-global-bank-backend/transaction-service
            dockerfile: techbleat-global-bank-backend/transaction-service/Dockerfile
          - name: activity-service
            context: techbleat-global-bank-backend/activity-service
            dockerfile: techbleat-global-bank-backend/activity-service/Dockerfile
          - name: finance-agent
            context: finance-agent
            dockerfile: finance-agent/Dockerfile
          - name: frontend
            context: techbleat-global-bank-frontend
            dockerfile: techbleat-global-bank-frontend/dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/techbleat-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # Immutable source-traceable tags only; no 'latest'.
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy image scan (release gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" image \
            --scanners vuln --severity "$TRIVY_SEVERITY" --ignore-unfixed --ignorefile .trivyignore \
            --format json --output "trivy-image-${{ matrix.name }}.json" "scan/${{ matrix.name }}:${{ github.sha }}"
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" convert \
            --format table --exit-code 1 --severity "$TRIVY_SEVERITY" "trivy-image-${{ matrix.name }}.json"

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-${{ matrix.name }}
          path: trivy-image-${{ matrix.name }}.json
          if-no-files-found: ignore

      # ---- Publish (push to main, v* tags, manual runs) -------------------------------------

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (reuses the scanned build from cache)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: false # SLSA provenance is attested below with GitHub's signed attestation

      - name: SBOM (SPDX)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attach SBOM attestation (keyless)
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "$IMAGE"

      - name: Build provenance attestation (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the release
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "${{ matrix.name }} ${IMAGE}@${DIGEST}" > "release-${{ matrix.name }}.txt"
          {
            echo "### ${{ matrix.name }}"
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Verify: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: release-${{ matrix.name }}.txt
