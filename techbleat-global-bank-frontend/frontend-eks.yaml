# Frontend Deployment and Service. Phase 3 replaces this with the GitOps manifests;
# set the image to a digest published by CI (see the workflow run summary).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-frontend
  namespace: banking
  labels:
    app: banking-frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: banking-frontend

  template:
    metadata:
      labels:
        app: banking-frontend

    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          # Immutable digest from CI, e.g. ghcr.io/olawalelateef9/techbleat-frontend@sha256:<digest>
          image: ghcr.io/olawalelateef9/techbleat-frontend@sha256:REPLACE_WITH_CI_DIGEST
          imagePullPolicy: IfNotPresent

          env:
            - name: KEYCLOAK_ORIGIN
              value: https://REPLACE_WITH_KEYCLOAK_HOST

          ports:
            - name: http
              containerPort: 8080

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 150m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /frontend-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /frontend-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: banking-frontend
  namespace: banking
spec:
  type: ClusterIP

  selector:
    app: banking-frontend

  ports:
    - name: http
      port: 80
      targetPort: http
