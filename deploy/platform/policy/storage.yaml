# Encrypted gp3 volumes for stateful workloads (Kafka). Volumes are deleted with their
# claims; scripts/down.sh removes claims before the cluster is destroyed.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
