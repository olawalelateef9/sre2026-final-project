# Reads techbleat/cluster/* from AWS Secrets Manager with the external-secrets Pod Identity
# role (no static credentials). Only the namespaces listed may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      prefix: techbleat/cluster/
  conditions:
    - namespaces: [banking, banking-admin, istio-ingress, datadog]
