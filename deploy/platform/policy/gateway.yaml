# The only public entry point: an internet-facing AWS Network Load Balancer in front of an
# Istio gateway. TLS terminates here; plain HTTP only serves ACME challenges and redirects.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: public-gateway-options
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
      # Keep the caller's source IP so rate limits and logs see the real client.
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
    - name: https-app
      protocol: HTTPS
      port: 443
      hostname: techbleatglobalbank.duckdns.org
      tls:
        mode: Terminate
        certificateRefs: [{name: bank-tls}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: banking}
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.techbleatglobalbank.duckdns.org
      tls:
        mode: Terminate
        certificateRefs: [{name: bank-tls}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
---
# Overrides for the gateway Deployment that Istio generates. The Coraza WAF loads the
# OWASP Core Rule Set into every Envoy worker, which needs far more memory than the
# mesh-wide proxy default (256Mi): the gateway was OOM-killed with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1536Mi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bank-tls
  namespace: istio-ingress
spec:
  secretName: bank-tls
  dnsNames:
    - techbleatglobalbank.duckdns.org
    - auth.techbleatglobalbank.duckdns.org
  # Production: duckdns.org is HSTS-preloaded, so browsers reject the untrusted staging
  # certificate outright. scripts/down.sh keeps this certificate between sessions.
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# Every plain-HTTP request is redirected to HTTPS. The temporary ACME challenge routes
# match /.well-known/acme-challenge/<token> exactly, which takes precedence.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - techbleatglobalbank.duckdns.org
    - auth.techbleatglobalbank.duckdns.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
