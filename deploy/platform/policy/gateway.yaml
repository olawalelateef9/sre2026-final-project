# The only public entry point: an internet-facing AWS Network Load Balancer in front of an
# Istio gateway. TLS terminates here; plain HTTP only serves ACME challenges and redirects.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
      # Keep the caller's source IP so rate limits and logs see the real client.
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
    - name: https-app
      protocol: HTTPS
      port: 443
      hostname: techbleatglobalbank.duckdns.org
      tls:
        mode: Terminate
        certificateRefs: [{name: bank-tls}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: banking}
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.techbleatglobalbank.duckdns.org
      tls:
        mode: Terminate
        certificateRefs: [{name: bank-tls}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bank-tls
  namespace: istio-ingress
spec:
  secretName: bank-tls
  dnsNames:
    - techbleatglobalbank.duckdns.org
    - auth.techbleatglobalbank.duckdns.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# Every plain-HTTP request is redirected to HTTPS. The temporary ACME challenge routes
# match /.well-known/acme-challenge/<token> exactly, which takes precedence.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - techbleatglobalbank.duckdns.org
    - auth.techbleatglobalbank.duckdns.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
