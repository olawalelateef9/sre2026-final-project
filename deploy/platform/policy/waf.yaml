# Web application firewall at the gateway: Coraza with the OWASP Core Rule Set (paranoia
# level 1, anomaly scoring, blocking). This stands in for the Cloudflare WAF, which cannot
# front a DuckDNS subdomain. Image pinned by digest; requests fail closed if the plugin
# cannot load.
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza-waf
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0@sha256:d66f944831428ea27039207fa4019bea55f9ea0a876d7b0dc8cc7c9e385fa4b1
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  failStrategy: FAIL_CLOSE
  pluginConfig:
    default_directives: default
    directives_map:
      default:
        - Include @recommended-conf
        - SecRuleEngine On
        - SecRequestBodyAccess On
        - SecResponseBodyAccess Off
        - Include @crs-setup-conf
        - Include @owasp_crs/*.conf
---
# Coarse flood protection per gateway replica, on top of the frontend's per-client
# sign-up limit and Keycloak's per-account brute-force lockout.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-rate-limit
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: public
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: gateway_rate_limit
            token_bucket:
              max_tokens: 200
              tokens_per_fill: 100
              fill_interval: 1s
            filter_enabled:
              runtime_key: gateway_rate_limit_enabled
              default_value: {numerator: 100, denominator: HUNDRED}
            filter_enforced:
              runtime_key: gateway_rate_limit_enforced
              default_value: {numerator: 100, denominator: HUNDRED}
            response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: {key: x-rate-limited, value: "true"}
