# Pod Security Admission "restricted" everywhere workloads run: non-root, no privilege
# escalation, dropped capabilities, seccomp RuntimeDefault.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# Banking services (Istio sidecars, strict mTLS) and the Kafka cluster (no sidecars;
# Kafka uses its own mutual TLS and ACLs).
apiVersion: v1
kind: Namespace
metadata:
  name: banking
  labels:
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
---
# Datadog Agent: reads node-level metrics and logs through host paths, so it needs the
# privileged Pod Security level; nothing else runs here.
apiVersion: v1
kind: Namespace
metadata:
  name: datadog
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# One-off administrative jobs (database setup) that hold master credentials; no sidecars
# so Jobs complete, and egress limited by NetworkPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: banking-admin
  labels:
    pod-security.kubernetes.io/enforce: restricted
