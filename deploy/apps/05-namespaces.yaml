# Namespaces and their mesh/pod-security labels, created before the operators that use them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: platform
  source:
    repoURL: https://github.com/olawalelateef9/sre2026-final-project.git
    targetRevision: main
    path: deploy/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: false, selfHeal: true}
