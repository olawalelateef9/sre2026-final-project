# Kafka operator. It only manages Kafka resources in the banking namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  source:
    repoURL: https://strimzi.io/charts
    chart: strimzi-kafka-operator
    targetRevision: 1.3.0
    helm:
      valuesObject:
        watchNamespaces: [banking]
        # Kafka pods must satisfy Pod Security "restricted" in the banking namespace.
        extraEnvs:
          - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
            value: restricted
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
