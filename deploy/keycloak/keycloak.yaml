# Keycloak runs outside the EKS cluster on ECS Fargate (infra/cluster/identity.tf), as in
# the target architecture. This namespace only holds the public route to it: the shared
# edge (NLB, WAF, TLS) serves auth.<domain> and forwards to Keycloak over verified TLS
# (DestinationRule in deploy/platform/policy/identity-tls.yaml).

# In-cluster name for the external identity platform (Cloud Map private DNS).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: ExternalName
  externalName: keycloak.identity.internal
  ports:
    # HTTP from the gateway's point of view; the DestinationRule upgrades it to TLS.
    - name: http
      port: 8443
      appProtocol: http
---
# Public routes: only the banking realm and static login assets. The admin console and the
# master realm are not reachable from the internet (operators use SSM port forwarding).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: public
      namespace: istio-ingress
      sectionName: https
  hostnames: [auth.techbleatglobalbank.duckdns.org]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /realms/banking/}
        - path: {type: PathPrefix, value: /resources/}
      backendRefs:
        - {name: keycloak, port: 8443}
