# References to AWS Secrets Manager entries (no secret values) and workload identities.
# Named external-secrets.yaml because .gitignore excludes any secrets.yaml.
# Per-service credentials from AWS Secrets Manager. Each service gets only its own
# database login (see deploy/data/db-init.yaml for the grants).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-config
  namespace: banking
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: user-service-config
    template:
      data:
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:5432/bankingdb?sslmode=require"
        KEYCLOAK_ADMIN_CLIENT_SECRET: "{{ .provisioner_secret }}"
  data:
    - {secretKey: db_host, remoteRef: {key: db/user_service, property: host}}
    - {secretKey: db_username, remoteRef: {key: db/user_service, property: username}}
    - {secretKey: db_password, remoteRef: {key: db/user_service, property: password}}
    - {secretKey: provisioner_secret, remoteRef: {key: keycloak/provisioner, property: client_secret}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transaction-service-config
  namespace: banking
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: transaction-service-config
    template:
      data:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .db_host }}:5432/bankingdb?sslmode=require"
        SPRING_DATASOURCE_USERNAME: "{{ .db_username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .db_password }}"
        REDIS_HOST: "{{ .redis_host }}"
        REDIS_PASSWORD: "{{ .redis_auth }}"
  data:
    - {secretKey: db_host, remoteRef: {key: db/transaction_service, property: host}}
    - {secretKey: db_username, remoteRef: {key: db/transaction_service, property: username}}
    - {secretKey: db_password, remoteRef: {key: db/transaction_service, property: password}}
    - {secretKey: redis_host, remoteRef: {key: valkey, property: host}}
    - {secretKey: redis_auth, remoteRef: {key: valkey, property: auth_token}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: activity-service-config
  namespace: banking
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: activity-service-config
    template:
      data:
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:5432/bankingdb?sslmode=require"
  data:
    - {secretKey: db_host, remoteRef: {key: db/activity_service, property: host}}
    - {secretKey: db_username, remoteRef: {key: db/activity_service, property: username}}
    - {secretKey: db_password, remoteRef: {key: db/activity_service, property: password}}
---
# Public certificate of the identity platform's CA, for user-service's TLS to Keycloak.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-ca
  namespace: banking
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: keycloak-ca
  data:
    - {secretKey: ca.crt, remoteRef: {key: keycloak/ca, property: ca_crt}}
---
# One identity per workload: Istio authorization and Kafka ACLs are keyed on these.
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, namespace: banking}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: user-service, namespace: banking}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: transaction-service, namespace: banking}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: activity-service, namespace: banking}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: finance-agent, namespace: banking}
automountServiceAccountToken: false
