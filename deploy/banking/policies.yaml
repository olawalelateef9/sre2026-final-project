# Service-to-service authorization, by workload identity (mTLS certificate), on top of the
# token, role and ownership checks inside each API. Anything not allowed here is denied.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-by-default
  namespace: banking
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: frontend
  namespace: banking
spec:
  selector:
    matchLabels: {app: frontend}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/public-istio"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: user-service
  namespace: banking
spec:
  selector:
    matchLabels: {app: user-service}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/frontend"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: transaction-service
  namespace: banking
spec:
  selector:
    matchLabels: {app: transaction-service}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/frontend"]
    # FinanceAgent may only read balances and history, never write.
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/finance-agent"]
      to:
        - operation:
            methods: [GET]
            paths: ["/balance/*", "/transactions/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: activity-service
  namespace: banking
spec:
  selector:
    matchLabels: {app: activity-service}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/frontend"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: finance-agent
  namespace: banking
spec:
  selector:
    matchLabels: {app: finance-agent}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/frontend"]
---
# Network layer, defense in depth: deny all ingress, then allow the same call paths.
# Kafka's own policies are generated by Strimzi from the listener's networkPolicyPeers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: banking
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Kubelet health probes, rewritten by the sidecar to its status port, come from the nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-probes
  namespace: banking
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.40.0.0/16}
      ports:
        - {protocol: TCP, port: 15020}
        - {protocol: TCP, port: 15021}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: banking
spec:
  podSelector:
    matchLabels: {app: frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-ingress}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-from-frontend
  namespace: banking
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [user-service, activity-service, finance-agent]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: frontend}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transaction-service
  namespace: banking
spec:
  podSelector:
    matchLabels: {app: transaction-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: frontend}
        - podSelector:
            matchLabels: {app: finance-agent}
      ports:
        - {protocol: TCP, port: 8080}
