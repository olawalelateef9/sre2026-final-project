spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Keycloak access-token validation. The issuer must match the token's iss claim exactly;
# the JWKS URL is where this service fetches signing keys, which can differ inside a container network.
banking.security.issuer=${KEYCLOAK_ISSUER:http://localhost:8080/realms/banking}
banking.security.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/banking/protocol/openid-connect/certs}
banking.security.audience=${KEYCLOAK_AUDIENCE:banking-api}
banking.security.role-client-id=${KEYCLOAK_ROLE_CLIENT_ID:banking-frontend}
